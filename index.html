<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Level Up Workout Planner</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
--bg:#0f172a;
--card:#111827;
--card2:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
--accent:#38bdf8;
--accent2:#8b5cf6;
--success:#22c55e;
}

body.light{
--bg:#f8fafc;
--card:#ffffff;
--card2:#eef2ff;
--text:#111827;
--muted:#64748b;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:linear-gradient(135deg,var(--bg),#111827);
color:var(--text);
font-size:clamp(14px,1.2vw,16px);
}

.container{
max-width:1100px;
margin:auto;
padding:clamp(12px,2vw,20px);
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:12px;
}

.title{
font-size:clamp(20px,3vw,32px);
font-weight:800;
background:linear-gradient(90deg,var(--accent),var(--accent2));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
display:flex;
align-items:center;
gap:10px;
}

.card{
background:linear-gradient(145deg,var(--card),var(--card2));
padding:clamp(12px,2vw,18px);
border-radius:18px;
margin-bottom:12px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
transition:.25s;
}

.card:hover{transform:translateY(-3px)}

.subject{
font-size:clamp(16px,2vw,20px);
font-weight:700;
display:flex;
align-items:center;
gap:8px;
}

.details{
margin-top:6px;
color:var(--muted);
font-size:clamp(12px,1.5vw,14px);
}

button{
border:none;
padding:10px 14px;
border-radius:12px;
cursor:pointer;
font-weight:700;
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:white;
transition:.2s;
}

button:hover{transform:scale(1.03)}

.completed{border:2px solid var(--success)}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
margin-bottom:16px;
}

.stat{
background:linear-gradient(145deg,var(--card),var(--card2));
padding:14px;
border-radius:16px;
text-align:center;
}

.stat h3{
margin:0;
font-size:clamp(12px,1.5vw,14px);
color:var(--muted);
}

.stat div{
font-size:clamp(16px,2vw,22px);
font-weight:700;
margin-top:4px;
}

.levelBar{
height:24px;
background:#334155;
border-radius:999px;
overflow:hidden;
margin-bottom:12px;
position:relative;
}

.levelFill{
height:100%;
width:0%;
background:linear-gradient(90deg,var(--accent),var(--accent2));
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
transition:.3s;
font-size:12px;
}

.motivation{
text-align:center;
margin-bottom:10px;
font-weight:700;
color:var(--accent);
font-size:clamp(14px,2vw,16px);
}

.header-buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.header-buttons button{
flex:1;
min-width:90px;
}

/* MOBILE */
@media (max-width:768px){

.header{
flex-direction:column;
align-items:stretch;
}

.header-buttons button{
width:100%;
}

.card{
padding:14px;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.levelBar{
height:22px;
}
}

/* SMALL MOBILE */
@media (max-width:420px){

.stats{
grid-template-columns:1fr;
}

button{
width:100%;
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div>
<div class="title">
<i class="fa-solid fa-dumbbell"></i>
Level Up Workout
</div>
<div id="today"></div>
</div>

<div class="header-buttons">
<button onclick="prevDay()"><i class="fa-solid fa-chevron-left"></i> Prev</button>
<button onclick="nextDay()"><i class="fa-solid fa-chevron-right"></i> Next</button>
<button onclick="toggleMode()"><i class="fa-solid fa-moon"></i> Theme</button>
</div>
</div>

<div class="stats">
<div class="stat">
<h3><i class="fa-solid fa-layer-group"></i> Level</h3>
<div id="level">1</div>
</div>

<div class="stat">
<h3><i class="fa-solid fa-bolt"></i> XP</h3>
<div id="xp">0</div>
</div>

<div class="stat">
<h3><i class="fa-solid fa-check"></i> Done</h3>
<div id="doneCount">0</div>
</div>

<div class="stat">
<h3><i class="fa-solid fa-arrow-up"></i> Next</h3>
<div id="nextXP">5 XP</div>
</div>
</div>

<div class="motivation" id="motivation"></div>

<div class="levelBar">
<div id="levelFill" class="levelFill">0%</div>
</div>

<div id="schedule"></div>

</div>

<script>
const workoutData = {
Monday:[
{subject:'Incline Push-Ups',sets:'3 x 8-12',target:'Chest, Shoulders, Triceps',how:'Use a bed or table.'},
{subject:'Dumbbell Floor Press',sets:'3 x 10-15',target:'Chest',how:'Press dumbbells upward.'},
{subject:'One Arm Row',sets:'3 x 12',target:'Back',how:'Pull to hip.'},
{subject:'Shoulder Press',sets:'3 x 10-15',target:'Shoulders',how:'Press overhead.'},
{subject:'Bicep Curl',sets:'3 x 12-15',target:'Biceps',how:'Curl slowly.'},
{subject:'Plank',sets:'3 x 40 sec',target:'Core',how:'Hold tight.'}
],
Tuesday:[{subject:'Goblet Squats',sets:'4 x 15',target:'Legs',how:'Squat deep.'}],
Wednesday:[{subject:'Recovery Day',sets:'-',target:'Rest',how:'Recover.'}],
Thursday:[{subject:'Push & Pull',sets:'4 sets',target:'Upper Body',how:'Train upper body.'}],
Friday:[{subject:'Leg Day',sets:'4 sets',target:'Lower Body',how:'Train legs.'}],
Saturday:[{subject:'Cardio',sets:'20-30 min',target:'Heart',how:'Move.'}],
Sunday:[{subject:'Rest Day',sets:'-',target:'Recovery',how:'Rest.'}]
};

let currentDate = new Date();
let completed = JSON.parse(localStorage.getItem("workoutDone")||"{}");
let xp = parseInt(localStorage.getItem("xp")||"0");

function getDateKey(){
return currentDate.toISOString().split("T")[0];
}

function levelCalc(xp){
return Math.floor(xp/5)+1;
}

function inLevel(xp){
return xp % 5;
}

function render(){

document.getElementById("today").textContent =
currentDate.toDateString();

let day = currentDate.toLocaleDateString('en-US',{weekday:'long'});
let data = workoutData[day] || [];
let box = document.getElementById("schedule");
box.innerHTML = "";

let keyDate = getDateKey();
let doneToday = 0;

data.forEach((e,i)=>{

let key = keyDate+"-"+i;
let done = completed[key];

if(done) doneToday++;

box.innerHTML += `
<div class="card ${done?'completed':''}">
<div class="subject"><i class="fa-solid fa-dumbbell"></i> ${e.subject}</div>
<div class="details"><b>Sets:</b> ${e.sets}</div>
<div class="details"><b>Target:</b> ${e.target}</div>
<div class="details"><b>How:</b> ${e.how}</div>
<button onclick="toggle('${key}')">
${done?'Completed':'Mark Complete'}
</button>
</div>`;
});

// LEVEL SYSTEM
let level = levelCalc(xp);
let inside = inLevel(xp);
let need = 5;
let percent = (inside/need)*100;

document.getElementById("level").textContent = level;
document.getElementById("xp").textContent = xp;
document.getElementById("doneCount").textContent = doneToday;

document.getElementById("nextXP").textContent =
(need-inside)+" XP left";

document.getElementById("levelFill").style.width = percent+"%";
document.getElementById("levelFill").textContent =
Math.floor(percent)+"%";

let titles=["Beginner","Warrior","Athlete","Elite","Champion","Legend"];
document.getElementById("motivation").textContent =
"Level "+level+" "+titles[Math.min(level-1,titles.length-1)];
}

function toggle(key){
if(!completed[key]){
completed[key]=true;
xp++;
}else{
completed[key]=false;
xp--;
if(xp<0) xp=0;
}

localStorage.setItem("workoutDone",JSON.stringify(completed));
localStorage.setItem("xp",xp);

render();
}

function prevDay(){
currentDate.setDate(currentDate.getDate()-1);
render();
}

function nextDay(){
currentDate.setDate(currentDate.getDate()+1);
render();
}

function toggleMode(){
document.body.classList.toggle("light");
}

render();
</script>

</body>
</html>
